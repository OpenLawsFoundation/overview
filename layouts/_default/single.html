{{ define "main" }}
<article class="doc">
  <div class="wrap doc-wrap">
    <header class="doc-head">
      {{ with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
      <h1>{{ .Title }}</h1>
      {{ with .Params.lede }}<p class="doc-lede">{{ . | safeHTML }}</p>{{ end }}
      {{ with .Params.repo }}
      <p class="doc-repo"><a href="https://github.com/OpenLawsFoundation/{{ . }}" rel="noopener"><code>{{ . }}</code> on GitHub ↗&#xFE0E;</a></p>
      {{ end }}
    </header>
    <div class="doc-body">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
