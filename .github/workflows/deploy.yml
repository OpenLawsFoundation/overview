name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Poll the org every 6 hours so new contributors/members appear without a push.
  schedule:
    - cron: "0 */6 * * *"
  # Lets an external automation (e.g. an org webhook -> this dispatch) rebuild
  # immediately when a new contributor shows up. Trigger with:
  #   gh api repos/OpenLawsFoundation/overview/dispatches -f event_type=contributors-changed
  repository_dispatch:
    types: [contributors-changed]

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
      HUGO_ENVIRONMENT: production
      TZ: Europe/Rome
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i /tmp/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Infer contributors from the organization
        # ORG_PAT (a read:org token) lets the "Core team" section pick up
        # organization members. Without it the script falls back to public
        # members and the build still succeeds (founders are always present).
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-contributors.py

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Validate SEO metadata
        run: python3 scripts/check-seo.py public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
